{% extends "base.html" %}
{% block title %}Recuperar contraseña · TaskFlow{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto mt-16 bg-white rounded-xl shadow p-8">
  <h1 class="text-2xl font-bold mb-2 text-center">Recuperar contraseña</h1>
  <p class="text-sm text-slate-600 mb-6 text-center">Escribe tu correo y te enviaremos un enlace para elegir una nueva.</p>
  <form method="post" class="space-y-4">
    {% csrf_token %}
    {% include "includes/form_fields.html" %}
    <button class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded">Enviar enlace</button>
  </form>
  <a href="{% url 'login' %}" class="block text-center text-sm text-blue-600 hover:underline mt-4">Volver a iniciar sesión</a>
</div>
{% endblock %}
