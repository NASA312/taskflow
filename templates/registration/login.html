{% extends "base.html" %}
{% block title %}Iniciar sesión · TaskFlow{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto mt-16 bg-white rounded-xl shadow p-8">
  <h1 class="text-2xl font-bold mb-6 text-center">Iniciar sesión</h1>

  <form method="post" class="space-y-4">
    {% csrf_token %}
    {% if form.non_field_errors %}
      <div class="text-red-600 text-sm">{{ form.non_field_errors }}</div>
    {% endif %}

    <div>
      <label class="block text-sm font-medium mb-1">Usuario</label>
      <input type="text" name="username" required
             class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Contraseña</label>
      <input type="password" name="password" required
             class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <input type="hidden" name="next" value="{{ next }}">
    <button class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded">
      Entrar
    </button>
  </form>
    <a href="{% url 'password_reset' %}" class="block text-center text-sm text-blue-600 hover:underline mt-4">¿Olvidaste tu contraseña?</a>
</div>
{% endblock %}
