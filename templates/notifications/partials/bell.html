<button type="button" @click="open = !open" aria-label="Notificaciones"
        class="relative p-1.5 text-slate-300 hover:text-white">
  <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
    <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0"/>
  </svg>
  {% if unread_count %}
    <span class="absolute -top-0.5 -right-0.5 bg-red-500 text-white text-[10px] font-bold rounded-full min-w-[1.1rem] h-[1.1rem] flex items-center justify-center px-1">
      {% if unread_count > 99 %}99+{% else %}{{ unread_count }}{% endif %}
    </span>
  {% endif %}
</button>

<div x-show="open" x-cloak
     class="absolute right-0 mt-2 w-80 bg-white text-slate-800 rounded-lg shadow-lg ring-1 ring-black/5 z-50">
  <div class="flex justify-between items-center px-4 py-2 border-b text-sm">
    <span class="font-semibold">Notificaciones</span>
    {% if unread_count %}
      <button hx-post="{% url 'notification_mark_all' %}" hx-target="#bell"
              class="text-xs text-blue-600 hover:underline">Marcar todas como leídas</button>
    {% endif %}
  </div>
  <ul class="max-h-80 overflow-y-auto divide-y text-sm">
    {% for n in latest %}
      <li>
        <a href="{% url 'notification_open' n.pk %}"
           class="block px-4 py-2 hover:bg-slate-50 {% if not n.read_at %}bg-blue-50{% endif %}">
          <p>{{ n.message }}</p>
          <p class="text-xs text-slate-500 mt-0.5">hace {{ n.created_at|timesince }}</p>
        </a>
      </li>
    {% empty %}
      <li class="px-4 py-6 text-center text-slate-500">No tienes notificaciones.</li>
    {% endfor %}
  </ul>
  <div class="flex justify-between px-4 py-2 border-t text-xs">
    <a href="{% url 'notification_list' %}" class="text-blue-600 hover:underline">Ver todas</a>
    <a href="{% url 'notification_preferences' %}" class="text-slate-500 hover:underline">Preferencias</a>
  </div>
</div>
