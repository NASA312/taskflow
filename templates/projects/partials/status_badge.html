<span class="px-2 py-0.5 rounded text-xs font-medium
  {% if project.status == 'planning' %}bg-slate-200 text-slate-700
  {% elif project.status == 'in_progress' %}bg-blue-100 text-blue-800
  {% elif project.status == 'on_hold' %}bg-yellow-100 text-yellow-800
  {% elif project.status == 'completed' %}bg-green-100 text-green-800
  {% else %}bg-red-100 text-red-800{% endif %}">
  {{ project.get_status_display }}
</span>
