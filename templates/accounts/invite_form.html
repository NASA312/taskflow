{% extends "base.html" %}
{% block title %}Invitar persona · TaskFlow{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-xl shadow p-8">
  <h1 class="text-xl font-bold mb-6">Invitar a tu empresa</h1>
  <form method="post" class="space-y-4">
    {% csrf_token %}
    {% include "includes/form_fields.html" %}
    <div class="flex gap-3 pt-2">
      <button class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded">Enviar invitación</button>
      <a href="{% url 'team_list' %}" class="px-5 py-2 rounded border hover:bg-slate-50">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
