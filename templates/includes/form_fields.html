{% if form.non_field_errors %}
  <div class="text-red-600 text-sm">{{ form.non_field_errors }}</div>
{% endif %}
{% for field in form %}
  <div>
    <label for="{{ field.id_for_label }}" class="block text-sm font-medium mb-1">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}<div class="text-xs text-slate-500 mt-1">{{ field.help_text|safe }}</div>{% endif %}
    {% for error in field.errors %}<p class="text-xs text-red-600 mt-1">{{ error }}</p>{% endfor %}
  </div>
{% endfor %}
