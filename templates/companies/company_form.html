{% extends "base.html" %}
{% block title %}Crear empresa · TaskFlow{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-10 bg-white rounded-xl shadow p-8">
  <h1 class="text-2xl font-bold mb-1">Crea tu empresa</h1>
  <p class="text-sm text-slate-600 mb-6">
    Serás el administrador. Después podrás invitar a tu equipo y crear proyectos.
  </p>
  <form method="post" class="space-y-4">
    {% csrf_token %}
    {% include "includes/form_fields.html" %}
    <button class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded">
      Crear empresa
    </button>
  </form>
</div>
{% endblock %}
